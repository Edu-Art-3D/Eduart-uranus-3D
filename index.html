<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduArt 3D</title>

  <!-- سكربت الحماية والتحويل للكمين -->
  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const secretKey = urlParams.get('key');
      if (secretKey !== 'edu2026') {
        window.location.href = "https://edu-art-3d-book.my.canva.site/space-trap";
      }
    })();
  </script>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      position: relative;
    }

    /* مكان اللوجو في الأعلى على اليمين فوق المجسم */
    .brand-logo {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 65px;
      height: auto;
      z-index: 9999;
    }

    /* تحديد ارتفاع المجسم */
    model-viewer {
      width: 100vw;
      height: calc(100vh - 120px);
      background-color: #ffffff;
    }

    /* إخفاء أيقونة وزر الواقع المعزز تماماً */
    model-viewer::part(ar-button) {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- صورة اللوجو -->
  <img src="logo.PNG" alt="EduArt Logo" class="brand-logo">

  <!-- عرض المجسم الـ 3D -->
  <model-viewer 
    src="uranus.glb" 
    alt="EduArt 3D Model" 
    camera-controls 
    scale="1 1 1">
  </model-viewer>

</body>
</html>
